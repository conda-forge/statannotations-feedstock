context:
  name: "statannotations"
  version: "0.7.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: a93e428682d66c9fca5a399d5bd3fe7c9cef0500f53840c6f5362526b4501e93

build:
  noarch: python
  script: python -m pip install . -vv
  number: 10

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy >=1.12.1
    - seaborn >=0.9.0
    - matplotlib-base >=2.2.2
    - pandas >=0.23.0
    - scipy >=1.1.0
    - statsmodels

tests:
  - python:
      imports:
        - statannotations
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/trevismd/statannotations
  summary: "add statistical significance annotations on seaborn plots. Further development of statannot, with bugfixes, new features, and a different API."
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mbhall88
    - trevismd
    - hadim
